[package]
name = "folio"
version = "0.1.1"
edition = "2021"
authors = ["truekry", "DeepSeek V4.1 Flash"]
license = "MIT"
description = "Folio — a quiet desktop studio for writing stories with an AI partner"

[dependencies]
eframe = "0.32.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2.12", features = ["json"] }
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Registry"] }

[profile.release]
opt-level = 2
